<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — TKM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-screen-2xl mx-auto px-6 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold">⚙️ Admin Panel — TK Montessori</h1>
            <nav class="space-x-4 text-sm">
                <a href="/dashboard" class="text-slate-600">Guru</a>
                <a href="/dashboard/ortu" class="text-slate-600">Ortu</a>
                <a href="/admin" class="text-blue-600 font-semibold">Admin</a>
                <a href="/docs" class="text-slate-600">API</a>
            </nav>
        </div>
    </header>
    <main class="max-w-screen-2xl mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <section class="bg-white rounded-lg shadow p-4">
                <h2 class="text-sm font-semibold text-slate-600 mb-2">👶 Students (CRUD via API)</h2>
                <div id="students">Loading...</div>
            </section>
            <section class="bg-white rounded-lg shadow p-4">
                <h2 class="text-sm font-semibold text-slate-600 mb-2">🧱 Materials</h2>
                <div id="materials">Loading...</div>
            </section>
            <section class="bg-white rounded-lg shadow p-4">
                <h2 class="text-sm font-semibold text-slate-600 mb-2">📍 Zones</h2>
                <div id="zones">Loading...</div>
            </section>
            <section class="bg-white rounded-lg shadow p-4">
                <h2 class="text-sm font-semibold text-slate-600 mb-2">📷 Cameras</h2>
                <div id="cameras">Loading...</div>
            </section>
            <section class="bg-white rounded-lg shadow p-4 md:col-span-2">
                <h2 class="text-sm font-semibold text-slate-600 mb-2">🗄️ MinIO Buckets & Files</h2>
                <div id="minio" class="text-xs font-mono">Loading...</div>
            </section>
        </div>
    </main>
    <script>
        const API = "/api/v1";
        function getToken() { return localStorage.getItem("tkm_token") || ""; }
        async function api(path) {
            const r = await fetch(API + path, {headers: {"Authorization": "Bearer " + getToken()}});
            if (!r.ok) return {error: r.status};
            return r.json();
        }
        async function load() {
            const s = await api("/students");
            document.getElementById("students").innerHTML = Array.isArray(s)
                ? `<table class="text-xs w-full"><tr><th>ID</th><th>Nama</th><th>NIS</th><th>ArUco</th><th>Class</th></tr>${s.map(x => `<tr><td>${x.id}</td><td>${x.name}</td><td>${x.nis || '-'}</td><td>${x.aruco_id ?? '-'}</td><td>${x.class_id}</td></tr>`).join('')}</table>`
                : "Login dulu: <a href='/login' class='text-blue-600'>login</a>";
            const m = await api("/materials");
            document.getElementById("materials").innerHTML = Array.isArray(m)
                ? `<ul class="text-xs grid grid-cols-2 gap-1">${m.map(x => `<li>${x.name} <span class="text-slate-500">(class_id=${x.yolo_class_id ?? '-'})</span></li>`).join('')}</ul>`
                : "-";
            const z = await api("/zones");
            document.getElementById("zones").innerHTML = Array.isArray(z)
                ? `<ul class="text-xs space-y-1">${z.map(x => `<li><strong>${x.name}</strong> (${x.zone_type}, class=${x.class_id}, color=${x.color || '-'})</li>`).join('')}</ul>`
                : "-";
            const c = await api("/cameras");
            document.getElementById("cameras").innerHTML = Array.isArray(c)
                ? `<ul class="text-xs space-y-1">${c.map(x => `<li><strong>${x.name}</strong> class=${x.class_id} fps=${x.fps} ${x.rtsp_url ? '<a href="'+x.rtsp_url+'" class="text-blue-600">rtsp</a>' : ''}</li>`).join('')}</ul>`
                : "-";
            const h = await fetch("/api/v1/health/full").then(r => r.json());
            document.getElementById("minio").innerHTML = `
                <div>DB: ${h.db ? '✅' : '❌'} | Redis: ${h.redis ? '✅' : '❌'} | MinIO: ${h.minio ? '✅' : '❌'}</div>
                <div>Buckets: ${(h.minio_buckets || []).join(', ')}</div>
                <div>Console MinIO: <a href="http://localhost:9001" target="_blank" class="text-blue-600">http://localhost:9001</a> (minioadmin / minioadmin)</div>
            `;
        }
        load();
    </script>
</body>
</html>
