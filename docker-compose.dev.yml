# docker-compose.dev.yml — postgres + redis + minio (PRD F1.1)
services:
  postgres:
    image: postgres:15-alpine
    container_name: tkm-postgres
    environment:
      POSTGRES_USER: tkm
      POSTGRES_PASSWORD: tkm123
      POSTGRES_DB: tkm
    ports:
      - "5432:5432"
    volumes:
      - tkm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tkm -d tkm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tkm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tkm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tkm
      MINIO_ROOT_PASSWORD: tkm12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tkm-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tkm-pgdata:
  tkm-miniodata:
